# استقرار خودمیزبان. تصویر رسمی Postgres 18؛ هدف تولید 18.6 است.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: petavu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: petavu
    command: ["postgres", "-c", "shared_preload_libraries=", "-c", "ssl=off"]
    volumes:
      - petavu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petavu"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PETAVU_ENV: staging
      DATABASE_URL: postgres://petavu:${POSTGRES_PASSWORD}@db:5432/petavu
      HTTP_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "4000:4000"
volumes:
  petavu_pg:
