# Illustration of independent deploys; BFF, TLS proxy and vault must be added before production.
# No credentials are embedded. This file is not deployed by the assistant.
services:
  web:
    build: {context: ., args: {APP_SCOPE: web}}
    environment: {APP_SCOPE: web, PETAVU_MODE: unconfigured, PETAVU_BASE_DOMAIN: '${PETAVU_BASE_DOMAIN:-}'}
    expose: ['8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  panel:
    build: {context: ., args: {APP_SCOPE: panel}}
    environment: {APP_SCOPE: panel, PETAVU_MODE: unconfigured, PETAVU_BASE_DOMAIN: '${PETAVU_BASE_DOMAIN:-}'}
    expose: ['8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  adminpanel:
    build: {context: ., args: {APP_SCOPE: adminpanel}}
    environment: {APP_SCOPE: adminpanel, PETAVU_MODE: unconfigured, PETAVU_BASE_DOMAIN: '${PETAVU_BASE_DOMAIN:-}'}
    expose: ['8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  shop:
    build: {context: ., args: {APP_SCOPE: shop}}
    environment: {APP_SCOPE: shop, PETAVU_MODE: unconfigured, PETAVU_BASE_DOMAIN: '${PETAVU_BASE_DOMAIN:-}'}
    expose: ['8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  adminshop:
    build: {context: ., args: {APP_SCOPE: adminshop}}
    environment: {APP_SCOPE: adminshop, PETAVU_MODE: unconfigured, PETAVU_BASE_DOMAIN: '${PETAVU_BASE_DOMAIN:-}'}
    expose: ['8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  database:
    image: postgres:18.6
    environment: {POSTGRES_DB: petavu, POSTGRES_PASSWORD_FILE: /run/secrets/db_password}
    secrets: [db_password]
    volumes: ['database:/var/lib/postgresql']
    networks: [backend]
    # No host port, no automatic application migrations or admin account.
secrets:
  db_password:
    file: '${POSTGRES_PASSWORD_FILE:?Provide a secret file outside the workspace}'
volumes:
  database:
networks:
  backend:
    internal: true
